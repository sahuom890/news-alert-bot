services:
  - type: web
    name: news-alert-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: TARGET_URL
        value: https://news.ycombinator.com/news
      - key: POLL_INTERVAL_SECONDS
        value: 300
      - key: MIN_POINTS_THRESHOLD
        value: 50
      - key: LOG_LEVEL
        value: INFO
      - key: DRY_RUN
        value: false
